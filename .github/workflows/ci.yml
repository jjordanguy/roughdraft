name: CI

on:
  pull_request:
  push:
    branches:
      - jordan/main
      - main

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04 in November 2026 and Playwright
    # 1.59 has no Chromium build for it, so the browser install step failed.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repo checks
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:smoke

      - name: Run coverage thresholds
        run: pnpm test:coverage
